<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Driving HUD</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Permission overlay -->
  <div id="permission-overlay">
    <div id="permission-text">请允许定位和陀螺仪权限</div>
    <button id="permission-btn">授权</button>
  </div>

  <!-- Main HUD -->
  <div id="hud">
    <!-- Top bar with compass and visitor counter -->
    <div id="top-bar">
      <div id="compass-bar"></div>
      <div id="visitor-counter">
        共<span id="visitor-count">--</span>人使用
      </div>
    </div>

    <!-- Content area -->
    <div id="content">
      <!-- Left column -->
      <div id="left-col">
        <div class="info-block">
          <span class="label">海拔 <span id="o2-icon" class="o2-icon">O₂</span></span>
          <div id="altitude" class="big-number">--<span class="unit">m</span></div>
        </div>
        <div class="info-block">
          <span id="location-text" class="secondary">正在获取位置...</span>
        </div>
      </div>

      <!-- Right column -->
      <div id="right-col">
        <div class="info-block">
          <span class="label">已行驶</span>
          <div id="distance" class="big-number">0<span class="unit">km</span></div>
        </div>
        <div class="info-block">
          <div id="drive-time" class="drive-time">00:00:00</div>
        </div>
        <div class="info-block">
          <div id="datetime" class="datetime">----/--/-- --:--:--</div>
        </div>
        <div class="info-block">
          <span id="sun-line" class="tertiary">☀ --:-- ☽ --:--</span>
        </div>
      </div>
    </div>
  </div>

  <script src="lib/suncalc.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/compass.js"></script>
  <script src="js/location.js"></script>
  <script src="js/geocoding.js"></script>
  <script src="js/app.js"></script>
  <!-- 不蒜子统计 UV -->
  <span id="busuanzi_container_site_uv" style="display:none">
    <span id="busuanzi_value_site_uv"></span>
  </span>
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js" data-site-id="https://ethanyan6.github.io/dagojo/"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var displayEl = document.getElementById('visitor-count');
      var busuanziEl = document.getElementById('busuanzi_value_site_uv');
      var retryCount = 0;
      var maxRetries = 20;
      var initialCheck = setInterval(function() {
        if (busuanziEl && busuanziEl.textContent && busuanziEl.textContent !== '--') {
          displayEl.textContent = busuanziEl.textContent;
          clearInterval(initialCheck);
          setInterval(function() {
            if (busuanziEl && busuanziEl.textContent && busuanziEl.textContent !== '--') {
              displayEl.textContent = busuanziEl.textContent;
            }
          }, 5000);
        }
        retryCount++;
        if (retryCount >= maxRetries) {
          clearInterval(initialCheck);
        }
      }, 500);
    });
  </script>
</body>
</html>
